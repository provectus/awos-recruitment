[project]
name = "awos-recruitment-mcp"
version = "0.1.0"
description = "MCP server providing AI coding assistants with a discovery engine for skills, agents, and tools."
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0",
    # Floor at 4.0.0: the test suite uses Client.server_info, which FastMCP 4
    # added, and FastMCP 4 requires mcp 2.x, which supersedes the mcp>=1.28.1
    # floor that patched CVE-2026-52869, CVE-2026-52870 and CVE-2026-59950.
    "fastmcp>=4.0.0",
    "posthog>=7.0.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Cooldown window: ignore package versions uploaded in the last 7 days.
# Mitigates zero-day supply-chain attacks (a malicious release has to survive
# 7 days of public scrutiny before we'll pick it up).
exclude-newer = "7 days"

# Per-package cooldown exemptions (`exclude-newer-package = { pkg = "<UTC timestamp>" }`)
# trade a few days of the window for a known, published CVE fix. Each one is a
# fixed ceiling for that package, so remove it once the release it admitted is
# older than the window — otherwise Dependabot and `uv lock --upgrade` can never
# move the package past it. Write cutoffs as explicit UTC timestamps: a bare
# date resolves against the locking machine's timezone. None are active today
# (the starlette 1.3.1 and cryptography 50.0.0 exemptions expired and were
# dropped on 2026-09-24).

[tool.hatch.build.targets.wheel]
packages = ["src/awos_recruitment_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
