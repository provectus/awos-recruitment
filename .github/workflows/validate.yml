name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # Errors fail the job. Skill-quality warnings show as PR annotations
      # (GitHub caps these at 10 per severity) and in full in the job summary.
      - name: Validate registry
        run: >-
          cd server && uv run python -m awos_recruitment_mcp.validate
          --format github --summary "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: cd server && uv run pytest
