name: CLI

# Lint, test, and build the npm CLI. Until this workflow existed the CLI's
# vitest suite never ran in CI and publish-cli shipped untested code.

on:
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  # Cancel superseded PR runs, but never a run on main: every main commit
  # should keep its own pass/fail record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the published tarball contains no test files
        run: |
          set -euo pipefail
          files=$(npm pack --dry-run --json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(p[0].files.map(f=>f.path).join("\n"))')
          echo "$files"
          if echo "$files" | grep -q "__tests__"; then
            echo "::error::dist/ contains test files; check tsconfig.build.json excludes"
            exit 1
          fi
