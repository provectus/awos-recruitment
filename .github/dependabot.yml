# Dependabot version updates for the three dependency surfaces in this repo.
#
# What this file does: opens weekly, grouped PRs when a newer version of a
# dependency exists. `allow: dependency-type: all` makes the npm and uv
# entries cover transitive (lock-only) packages too — anyio, which turned the
# Image Scan red on 2026-09-24 (CVE-2026-63374), is not in pyproject.toml,
# only in uv.lock.
#
# What this file cannot do: enable Dependabot *security* updates. That is a
# repository setting (Settings > Code security > Dependabot security updates),
# enabled separately on 2026-09-24. Security PRs skip the cooldown below, but
# for the uv surface they still run through `uv lock --upgrade-package`, so
# the server's own `exclude-newer = "7 days"` (server/pyproject.toml) applies:
# a fix uploaded less than a week ago needs a manual `exclude-newer-package`
# exemption before a PR can be produced.
#
# Cooldown mirrors that uv policy: a release must be public for 7 days before
# a version-update PR is opened.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      cli-runtime:
        dependency-type: production
      cli-dev:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      server:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
