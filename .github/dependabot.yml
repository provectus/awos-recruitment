# Dependabot keeps three dependency surfaces current and opens PRs for
# security advisories. Without it, 24 advisories (5 critical) sat unnoticed
# on main until the Image Scan went red on 2026-09-24 (anyio CVE-2026-63374).
#
# Cooldown mirrors the server's uv policy (`exclude-newer = "7 days"` in
# server/pyproject.toml): a release must be public for a week before a bump
# PR is opened. Security updates ignore the cooldown by design.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cli-dev:
        dependency-type: development
      cli-runtime:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      server:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
